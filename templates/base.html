<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cartera CRM{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

  <!-- barra de carga superior -->
  <div id="loadbar"></div>

  {% if session.user %}
    <!-- barra fina con hamburguesa + marca -->
    <header class="d-flex align-items-center gap-2 px-3 py-2 bg-dark text-white shadow-sm sticky-top">
      <button class="btn btn-dark btn-sm border-0 lh-1 p-1" type="button"
              data-bs-toggle="offcanvas" data-bs-target="#sidemenu" aria-controls="sidemenu" aria-label="Menú">
        <i class="bi bi-list fs-4"></i>
      </button>
      <a class="fw-semibold text-white text-decoration-none d-flex align-items-center gap-2" href="{{ url_for('main.index') }}">
        <i class="bi bi-wallet2"></i> Cartera CRM
      </a>
    </header>

    <!-- menu lateral (offcanvas) -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidemenu" aria-labelledby="sidemenuLabel">
      <div class="offcanvas-header bg-dark text-white">
        <h5 class="offcanvas-title d-flex align-items-center gap-2 mb-0" id="sidemenuLabel">
          <i class="bi bi-wallet2"></i> Cartera CRM
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-0">
        <ul class="nav nav-pills flex-column p-3 gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}" href="{{ url_for('main.index') }}">
              <i class="bi bi-house-door me-2"></i>Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'portfolio.portfolio_table' %}active{% endif %}" href="{{ url_for('portfolio.portfolio_table') }}">
              <i class="bi bi-table me-2"></i>Cartera
            </a>
          </li>
        </ul>
        <div class="mt-auto border-top p-3">
          <div class="small text-muted mb-2 text-truncate">
            <i class="bi bi-person-circle me-2"></i>{{ session.user.name or session.user.preferred_username }}
          </div>
          <a class="btn btn-outline-danger btn-sm w-100" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
          </a>
        </div>
      </div>
    </div>
  {% endif %}

  <main class="{% block main_class %}container py-4{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/loadbar.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
